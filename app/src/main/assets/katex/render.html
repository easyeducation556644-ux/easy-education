<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="katex.min.css" />
  <script src="katex.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.45; word-break: normal; overflow-wrap: anywhere; }
    #root { display: block; width: 100%; box-sizing: border-box; white-space: pre-wrap; }
    .cps-math { white-space: nowrap; display: inline; }
    .katex { font-size: 1.06em; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  const root = document.getElementById('root');
  let observer = null;

  function decodeUtf8Base64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function reportHeight() {
    if (!window.AndroidMath || !window.AndroidMath.reportHeight) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        const cssPx = Math.max(
          document.documentElement.scrollHeight || 0,
          document.body.scrollHeight || 0,
          root.scrollHeight || 0
        );
        window.AndroidMath.reportHeight(Math.ceil(cssPx * (window.devicePixelRatio || 1)));
      });
    });
  }

  function appendPlain(value) {
    root.appendChild(document.createTextNode(value || ''));
  }

  window.renderContent = function (encoded) {
    try {
      const payload = JSON.parse(decodeUtf8Base64(encoded));
      root.replaceChildren();
      document.body.style.color = payload.color || '#111111';
      document.body.style.fontSize = (payload.fontSize || 16) + 'px';
      document.body.style.fontWeight = String(payload.fontWeight || 400);

      (payload.segments || []).forEach(function (segment) {
        const value = String(segment.value || '');
        if (segment.kind !== 'math') {
          appendPlain(value);
          return;
        }
        const span = document.createElement('span');
        span.className = 'cps-math';
        try {
          if (!window.katex || !window.katex.render) throw new Error('KaTeX unavailable');
          window.katex.render(value, span, {
            throwOnError: false,
            displayMode: false,
            strict: 'ignore',
            trust: false,
            output: 'htmlAndMathml'
          });
          root.appendChild(span);
        } catch (error) {
          appendPlain(value);
        }
      });

      if (observer) observer.disconnect();
      if (window.ResizeObserver) {
        observer = new ResizeObserver(reportHeight);
        observer.observe(root);
      }
      reportHeight();
      return true;
    } catch (error) {
      root.replaceChildren();
      root.appendChild(document.createTextNode(''));
      reportHeight();
      return false;
    }
  };

  window.addEventListener('load', reportHeight);
})();
</script>
</body>
</html>
