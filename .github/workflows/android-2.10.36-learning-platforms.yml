name: Android 2.10.36 learning platforms

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-2.10.36-learning-platforms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION: "2.10.36"
      VERSION_CODE: "2103600"
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}

    steps:
      - name: Checkout web main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          path: native

      - name: Verify release contents
        shell: bash
        run: |
          grep -q 'versionCode = 2103600' native/app/build.gradle.kts
          grep -q 'versionName = "2.10.36"' native/app/build.gradle.kts
          grep -q 'udvash://' native/app/src/main/java/com/easyeducation/app/NativeUdvashRepository.kt
          grep -q 'resolveUdvash' native/app/src/main/java/com/easyeducation/app/NativePlaybackSourceResolver.kt
          grep -q 'youtubeUrl.isNotBlank' native/app/src/main/java/com/easyeducation/app/NativePlaybackSourceResolver.kt
          grep -q 'Checking for updates' native/app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt
          grep -q 'YoutubeClassWatchPage' native/app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt
          test -f native/app/src/main/java/com/easyeducation/app/NativeExternalCoursesRepository.kt
          test -f native/app/src/main/java/com/easyeducation/app/NativeExternalCoursesScreens.kt
          grep -q 'NativeExternalPlatformsHomeBlock' native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          grep -q 'provider-class/' native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          test -f server/api-resources/external-courses.js
          grep -q "external-courses" api/version.js
          grep -q '/api/external-courses' vercel.json
          grep -q 'bondipathshalaschool.com.bd/api/courses' server/api-resources/external-courses.js
          grep -q 'ieducationbd.com/api/course/admin/course/all-course' server/api-resources/external-courses.js
          grep -q 'medilogy.com.bd/api/course/admin/course/all-course' server/api-resources/external-courses.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        shell: bash
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: native

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs native/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-$VERSION"
          ASSET="Easy-Education-$VERSION.apk"
          APK="$RUNNER_TEMP/$ASSET"
          cp native/app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Udvash now shows cached content immediately on every screen and refreshes live in the background with a bottom update loader. Udvash classes use the normal Easy Education class page, notes appear in Resources, YouTube is preferred, and signed Udvash sources are re-resolved through fresh CardDetails when playback refreshes. Adds native iEducation, Medilogy and BP School course browsing from their provider APIs with cache-first refresh and the standard Easy Education class page."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Easy Education $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target android --title "Easy Education $VERSION" --notes "$NOTES"
          fi
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish in-app update metadata
        shell: bash
        run: |
          cat > public/app-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/easyeducation556644-ux/easy-education/releases/download/android-$VERSION/Easy-Education-$VERSION.apk",
            "sha256": "$APK_SHA256",
            "force": false,
            "notes": "Cache-first Udvash refresh, standard class page/resources, signed-source recovery, plus iEducation, Medilogy and BP School."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git commit -m "Publish Android $VERSION learning platforms metadata"
          git push origin HEAD:main

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.36-release-apk
          path: native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
