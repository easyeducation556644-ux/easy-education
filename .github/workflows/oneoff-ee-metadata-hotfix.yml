name: One-off EE metadata runtime hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-ee-metadata-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair runtime marker placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('api/telegram-bot.js')
          s = p.read_text()

          # 1) The lightweight hierarchy/cache repair must never reference the
          # media resolver's local `error` variable.
          a = s.index('async function repairImportedClassSync')
          b = s.index('function selectedSourceClasses', a)
          segment = s[a:b]
          segment = segment.replace('        eeBotMetadataSchema: error ? 0 : BOT_CLASS_METADATA_SCHEMA,\n', '')
          segment = segment.replace('                  eeBotMetadataSchema: error ? 0 : BOT_CLASS_METADATA_SCHEMA,\n', '')
          if 'error ? 0 : BOT_CLASS_METADATA_SCHEMA' in segment:
              raise SystemExit('Could not remove undefined error reference from repairImportedClassSync')
          s = s[:a] + segment + s[b:]

          # 2) New class writes *do* have a local `error`; place the metadata
          # schema marker there so successful future imports are considered complete.
          a = s.index('async function writeSyncResults')
          b = s.index('async function repairSelectedMetadata', a)
          segment = s[a:b]
          marker = 'eeBotMetadataSchema: error ? 0 : BOT_CLASS_METADATA_SCHEMA'
          if marker not in segment:
              needle = '        eeBotSyncSchema: BOT_CLASS_SYNC_SCHEMA,\n        updatedAt: serverNow(),\n        createdAt: serverNow(),'
              if needle not in segment:
                  raise SystemExit('writeSyncResults schema anchor not found')
              segment = segment.replace(
                  needle,
                  '        eeBotSyncSchema: BOT_CLASS_SYNC_SCHEMA,\n        eeBotMetadataSchema: error ? 0 : BOT_CLASS_METADATA_SCHEMA,\n        updatedAt: serverNow(),\n        createdAt: serverNow(),',
                  1,
              )
          s = s[:a] + segment + s[b:]
          p.write_text(s)

          # Acceptance checks on the resulting source.
          s = p.read_text()
          a = s.index('async function repairImportedClassSync')
          b = s.index('function selectedSourceClasses', a)
          assert 'error ? 0 : BOT_CLASS_METADATA_SCHEMA' not in s[a:b]
          a = s.index('async function writeSyncResults')
          b = s.index('async function repairSelectedMetadata', a)
          assert marker in s[a:b]
          print('PASS: runtime marker placement')
          PY

          node --check api/telegram-bot.js

      - name: Commit hotfix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-ee-metadata-hotfix.yml
          git add api/telegram-bot.js
          git commit -m "Fix EE metadata repair runtime marker"
          git push origin main
