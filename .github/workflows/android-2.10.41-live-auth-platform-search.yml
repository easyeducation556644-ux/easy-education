                              }
                              Icon(Icons.Default.ArrowForward, null)
                          }
                      }
                  }
                  item { Spacer(Modifier.height(18.dp)) }
              }
          }

          @Composable
          fun NativeManualCoursesScreen'''
          s = s[:m.start()] + replacement + s[m.end():]

          old = '''fun NativeManualCoursesScreen(nav: NavHostController, state: NativeUiState) {
              val courses = manualEasyEducationCourses(state)
              LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(11.dp)) {
                  item { HubHeader(nav, "Easy Education", "Manual uploaded courses") }
                  if (courses.isEmpty()) {'''
          new = '''fun NativeManualCoursesScreen(nav: NavHostController, state: NativeUiState) {
              val courses = manualEasyEducationCourses(state)
              var query by rememberSaveable { mutableStateOf("") }
              val filtered = courses.filter { course ->
                  query.isBlank() || course.title.contains(query, ignoreCase = true) || course.description.contains(query, ignoreCase = true)
              }
              LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(11.dp)) {
                  item { HubHeader(nav, "Easy Education", "Manual uploaded courses") }
                  item { OutlinedTextField(value = query, onValueChange = { query = it }, modifier = Modifier.fillMaxWidth(), singleLine = true, label = { Text("Search courses") }) }
                  if (filtered.isEmpty()) {'''
          if old not in s: raise SystemExit('Manual course search marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('            items(courses, key = { it.id }) { course ->', '            items(filtered, key = { it.id }) { course ->', 1)

          # Replace live home card so CPS is fetched directly instead of depending on possibly stale ViewModel state.
          pattern = re.compile(r'@Composable\nfun NativeLiveClassesHomeCard\(nav: NavHostController, state: NativeUiState\) \{.*?\n\}\n\n@Composable\nprivate fun HubCountPill', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('Live home card block not found')
          block = '''@Composable
          fun NativeLiveClassesHomeCard(nav: NavHostController, state: NativeUiState) {
              val context = LocalContext.current
              val udvashRepository = remember { NativeUdvashRepository(context) }
              val cpsRepository = remember { NativeCpsRepository(context) }
              var liveState by remember { mutableStateOf(UdvashLiveUiState()) }
              var cpsCatalog by remember { mutableStateOf(cpsRepository.cachedCatalog()) }

              LaunchedEffect(state.online) {
                  liveState = UdvashLiveUiState(data = withContext(Dispatchers.IO) { udvashRepository.cachedLiveClasses() }, refreshing = state.online)
                  cpsCatalog = withContext(Dispatchers.IO) { cpsRepository.cachedCatalog() }
                  if (state.online) {
                      runCatching { withContext(Dispatchers.IO) { udvashRepository.liveClasses() } }
                          .onSuccess { liveState = UdvashLiveUiState(data = it, refreshing = false) }
                          .onFailure { error -> liveState = liveState.copy(refreshing = false, error = error.message.orEmpty()) }
                      runCatching { withContext(Dispatchers.IO) { cpsRepository.browse() } }.onSuccess { cpsCatalog = it }
                  }
              }

              val cpsLive = cpsCatalog.liveHighlights.ifEmpty { state.cpsLiveHighlights }
              val running = cpsLive.count { it.status.isRunningStatus() } + (liveState.data?.totalLiveClass ?: 0)
              val upcoming = cpsLive.count { !it.status.isRunningStatus() } + (liveState.data?.totalUpcomingClass ?: 0)
              Card(
                  modifier = Modifier.fillMaxWidth().clickable { nav.navigate("live-classes") },
                  shape = HubCardShape,
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.secondaryContainer),
              ) {
                  Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(shape = RoundedCornerShape(15.dp), color = MaterialTheme.colorScheme.onSecondaryContainer.copy(alpha = .10f)) {
                          Icon(Icons.Default.VideoLibrary, null, Modifier.padding(10.dp).size(25.dp), tint = MaterialTheme.colorScheme.onSecondaryContainer)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          Text("Live classes", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.ExtraBold)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              HubCountPill("$running running", running > 0)
                              HubCountPill("$upcoming upcoming", false)
                          }
                          Text("Open to choose a platform", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSecondaryContainer.copy(alpha = .74f))
                      }
                      if (liveState.refreshing) CircularProgressIndicator(Modifier.size(18.dp), strokeWidth = 2.dp)
                      else Icon(Icons.Default.ArrowForward, "Open live classes")
                  }
              }
          }

          @Composable
          private fun HubCountPill'''
          s = s[:m.start()] + block + s[m.end():]

          pattern = re.compile(r'@Composable\nfun NativeLivePlatformsScreen\(nav: NavHostController, state: NativeUiState\) \{.*?\n\}\n\n@Composable\nprivate fun LivePlatformCard', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('Live platforms block not found')
          block = '''@Composable
          fun NativeLivePlatformsScreen(nav: NavHostController, state: NativeUiState) {
              val context = LocalContext.current
              val udvashRepository = remember { NativeUdvashRepository(context) }
              val cpsRepository = remember { NativeCpsRepository(context) }
              var reload by remember { mutableIntStateOf(0) }
              var liveState by remember { mutableStateOf(UdvashLiveUiState()) }
              var cpsCatalog by remember { mutableStateOf(cpsRepository.cachedCatalog()) }
              var cpsRefreshing by remember { mutableStateOf(false) }

              LaunchedEffect(reload, state.online) {
                  liveState = UdvashLiveUiState(data = withContext(Dispatchers.IO) { udvashRepository.cachedLiveClasses() }, refreshing = state.online)
                  cpsCatalog = withContext(Dispatchers.IO) { cpsRepository.cachedCatalog() }
                  if (state.online) {
                      cpsRefreshing = true
                      runCatching { withContext(Dispatchers.IO) { udvashRepository.liveClasses() } }
                          .onSuccess { liveState = UdvashLiveUiState(data = it, refreshing = false) }
                          .onFailure { error -> liveState = liveState.copy(refreshing = false, error = error.message.orEmpty()) }
                      runCatching { withContext(Dispatchers.IO) { cpsRepository.browse() } }.onSuccess { cpsCatalog = it }
                      cpsRefreshing = false
                  }
              }

              val cpsLive = cpsCatalog.liveHighlights.ifEmpty { state.cpsLiveHighlights }
              LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(11.dp)) {
                  item { HubHeader(nav, "Live classes", "Choose a platform") }
                  item {
                      LivePlatformCard("Udvash", liveState.data?.totalLiveClass ?: 0, liveState.data?.totalUpcomingClass ?: 0, liveState.refreshing) {
                          nav.navigate("live-classes/udvash")
                      }
                  }
                  item {
                      LivePlatformCard("CPS", cpsLive.count { it.status.isRunningStatus() }, cpsLive.count { !it.status.isRunningStatus() }, cpsRefreshing) {
                          nav.navigate("live-classes/cps")
                      }
                  }
                  if (liveState.error.isNotBlank()) item {
                      TextButton(onClick = { reload += 1 }) { Icon(Icons.Default.Refresh, null, Modifier.size(17.dp)); Spacer(Modifier.width(7.dp)); Text("Retry live data") }
                  }
                  item { Text("Easy Education manual courses are not listed here because Easy Education does not host live classes.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant) }
                  item { Spacer(Modifier.height(18.dp)) }
              }
          }

          @Composable
          private fun LivePlatformCard'''
          s = s[:m.start()] + block + s[m.end():]

          pattern = re.compile(r'@Composable\nfun NativeCpsGlobalLiveScreen\(nav: NavHostController, state: NativeUiState\) \{.*?\n\}\n\n@Composable\nfun NativeUdvashLiveClassesScreen', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('CPS global live block not found')
          block = '''@Composable
          fun NativeCpsGlobalLiveScreen(nav: NavHostController, state: NativeUiState) {
              val context = LocalContext.current
              val repository = remember { NativeCpsRepository(context) }
              var catalog by remember { mutableStateOf(repository.cachedCatalog()) }
              var refreshing by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf("") }
              LaunchedEffect(state.online) {
                  catalog = withContext(Dispatchers.IO) { repository.cachedCatalog() }
                  if (state.online) {
                      refreshing = true
                      runCatching { withContext(Dispatchers.IO) { repository.browse() } }
                          .onSuccess { catalog = it; error = "" }
                          .onFailure { error = it.message.orEmpty() }
                      refreshing = false
                  }
              }
              val classes = catalog.liveHighlights.ifEmpty { state.cpsLiveHighlights }.sortedWith(compareByDescending<NativeCpsLiveClass> { it.status.isRunningStatus() }.thenBy { it.startTime })
              val running = classes.count { it.status.isRunningStatus() }
              val upcoming = classes.count { !it.status.isRunningStatus() }
              LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(11.dp)) {
                  item { HubHeader(nav, "CPS live classes", "$running running • $upcoming upcoming") }
                  if (refreshing) item { CircularProgressIndicator(Modifier.size(22.dp), strokeWidth = 2.dp) }
                  if (classes.isEmpty()) item { HubMessage(if (error.isNotBlank()) error else "No CPS live or upcoming class is available right now.") }
                  else items(classes, key = { it.id }) { live ->
                      Card(
                          modifier = Modifier.fillMaxWidth().clickable(enabled = live.url.isNotBlank() && live.hasAccess) { NativeCpsLivePlayerActivity.openLive(context, live.title, live.url, live.id) },
                          shape = HubRowShape,
                          border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      ) {
                          Column(Modifier.padding(15.dp), verticalArrangement = Arrangement.spacedBy(7.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  HubCountPill(if (live.status.isRunningStatus()) "RUNNING" else "UPCOMING", live.status.isRunningStatus())
                                  Spacer(Modifier.width(8.dp)); Text(live.platform.ifBlank { "CPS" }, style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Text(live.title, fontWeight = FontWeight.ExtraBold, style = MaterialTheme.typography.titleMedium)
                              if (live.courseTitle.isNotBlank()) Text(live.courseTitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              if (live.startTime.isNotBlank()) Text(live.startTime, style = MaterialTheme.typography.bodySmall)
                              if (live.url.isNotBlank() && live.hasAccess) Text("Tap to join", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary)
                          }
                      }
                  }
                  item { Spacer(Modifier.height(18.dp)) }
              }
          }

          @Composable
          fun NativeUdvashLiveClassesScreen'''
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)

      - name: Add search bars to platform catalogs
        shell: python
        working-directory: native
        run: |
          from pathlib import Path

          # Udvash catalog search.
          p = Path('app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt'); s = p.read_text()
          if 'import androidx.compose.material3.OutlinedTextField' not in s:
              s = s.replace('import androidx.compose.material3.MaterialTheme\n', 'import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedTextField\n', 1)
          if 'import androidx.compose.runtime.saveable.rememberSaveable' not in s:
              s = s.replace('import androidx.compose.runtime.remember\n', 'import androidx.compose.runtime.remember\nimport androidx.compose.runtime.saveable.rememberSaveable\n', 1)
          marker = '    var state by remember { mutableStateOf(UdvashLoadState<List<NativeUdvashCourse>>()) }\n'
          if marker in s and 'var query by rememberSaveable { mutableStateOf("") }' not in s:
              s = s.replace(marker, marker + '    var query by rememberSaveable { mutableStateOf("") }\n', 1)
          marker = '    UdvashPageScaffold(nav, "Udvash") {\n'
          if marker in s and 'label = { Text("Search courses") }' not in s[s.find(marker):s.find(marker)+500]:
              s = s.replace(marker, marker + '        item { OutlinedTextField(value = query, onValueChange = { query = it }, modifier = Modifier.fillMaxWidth(), singleLine = true, label = { Text("Search courses") }) }\n', 1)
          old = '            else -> items(state.data.orEmpty(), key = { it.id }) { course ->\n'
          new = '            else -> {\n                val filtered = state.data.orEmpty().filter { query.isBlank() || it.title.contains(query, ignoreCase = true) }\n                if (filtered.isEmpty()) item { UdvashEmpty("No matching course", "Try another search term.") }\n                else items(filtered, key = { it.id }) { course ->\n'
          if old in s:
              s = s.replace(old, new, 1)
              # close the added else block just before refresh footer
              footer = '        UdvashRefreshFooter(state.refreshing, state.data != null, state.error) { reload += 1 }\n'
              idx = s.find(footer, s.find(new))
              if idx < 0: raise SystemExit('Udvash footer marker not found')
              s = s[:idx] + '            }\n' + s[idx:]
          p.write_text(s)

          # External catalogs (iEducation, Medilogy, Bondi Pathshala).
          p = Path('app/src/main/java/com/easyeducation/app/NativeExternalCoursesScreens.kt'); s = p.read_text()
          if 'import androidx.compose.material3.OutlinedTextField' not in s:
              s = s.replace('import androidx.compose.material3.MaterialTheme\n', 'import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedTextField\n', 1)
          marker = '    var state by remember(providerId) { mutableStateOf(ExternalLoadState<List<NativeExternalCourse>>()) }\n'
          if marker in s and 'var query by rememberSaveable(providerId)' not in s:
              s = s.replace(marker, marker + '    var query by rememberSaveable(providerId) { mutableStateOf("") }\n', 1)
          marker = '        item { ExternalHeader(nav = nav, title = title, subtitle = "Live course catalog") }\n'
          if marker in s:
              s = s.replace(marker, marker + '        item { OutlinedTextField(value = query, onValueChange = { query = it }, modifier = Modifier.fillMaxWidth(), singleLine = true, label = { Text("Search courses") }) }\n', 1)
          old = '            else -> items(state.data.orEmpty(), key = { it.id }) { course ->\n'
          new = '            else -> {\n                val filtered = state.data.orEmpty().filter { course -> query.isBlank() || course.title.contains(query, ignoreCase = true) || course.description.contains(query, ignoreCase = true) || course.batch.contains(query, ignoreCase = true) }\n                if (filtered.isEmpty()) item { ExternalMessage("No course matched your search.") }\n                else items(filtered, key = { it.id }) { course ->\n'
          if old in s:
              s = s.replace(old, new, 1)
              footer = '        ExternalRefreshFooter(state.refreshing, state.data != null, state.error) { reload += 1 }\n'
              idx = s.find(footer, s.find(new))
              if idx < 0: raise SystemExit('External footer marker not found')
              s = s[:idx] + '            }\n' + s[idx:]
          p.write_text(s)

          # CPS keeps its rich existing V2 catalog. Put search above it and show a filtered result
          # list only while a query is active.
          p = Path('app/src/main/java/com/easyeducation/app/NativeCpsHub.kt'); s = p.read_text()
          imports = {
              'import androidx.compose.foundation.layout.fillMaxSize\n': 'import androidx.compose.foundation.layout.fillMaxSize\n',
          }
          if 'import androidx.compose.foundation.layout.fillMaxSize' not in s:
              s = s.replace('import androidx.compose.foundation.layout.fillMaxWidth\n', 'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\n', 1)
          if 'import androidx.compose.foundation.layout.weight' not in s:
              s = s.replace('import androidx.compose.foundation.layout.width\n', 'import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.weight\n', 1)
          if 'import androidx.compose.foundation.lazy.LazyColumn' not in s:
              s = s.replace('import androidx.compose.foundation.shape.CircleShape\n', 'import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.shape.CircleShape\n', 1)
          if 'import androidx.compose.material3.OutlinedTextField' not in s:
              s = s.replace('import androidx.compose.material3.MaterialTheme\n', 'import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedTextField\n', 1)
          if 'import androidx.compose.runtime.getValue' not in s:
              s = s.replace('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.runtime.setValue\n', 1)
          if 'import android.net.Uri' not in s:
              s = s.replace('package com.easyeducation.app\n', 'package com.easyeducation.app\n\nimport android.net.Uri', 1)
          old = '''@Composable
          fun NativeCpsCatalogScreen(nav: NavHostController, state: NativeUiState) {
              NativeCpsCatalogScreenV2(nav, state)
          }'''
          new = '''@Composable
          fun NativeCpsCatalogScreen(nav: NavHostController, state: NativeUiState) {
              var query by rememberSaveable { mutableStateOf("") }
              val filtered = state.cpsCourses.filter { entry ->
                  query.isBlank() || entry.course.title.contains(query, ignoreCase = true) || entry.course.description.contains(query, ignoreCase = true)
              }
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp),
                      singleLine = true,
                      label = { Text("Search courses") },
                  )
                  if (query.isBlank()) {
                      androidx.compose.foundation.layout.Box(Modifier.fillMaxWidth().weight(1f)) { NativeCpsCatalogScreenV2(nav, state) }
                  } else {
                      LazyColumn(Modifier.fillMaxWidth().weight(1f).padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          if (filtered.isEmpty()) item { Text("No CPS course matched your search.", color = MaterialTheme.colorScheme.onSurfaceVariant) }
                          items(filtered, key = { it.course.id }) { entry ->
                              Card(
                                  modifier = Modifier.fillMaxWidth().clickable { nav.navigate("course/${entry.course.id}") },
                                  shape = RoundedCornerShape(17.dp),
                                  border = androidx.compose.foundation.BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              ) {
                                  Row(Modifier.padding(15.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text(entry.course.title, fontWeight = FontWeight.ExtraBold)
                                          if (entry.course.description.isNotBlank()) Text(entry.course.description, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                          Text(if (entry.hasAccess) "Access active" else "Preview", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)
                                      }
                                      Icon(Icons.Default.ArrowForward, null)
                                  }
                              }
                          }
                      }
                  }
              }
          }'''
          if old in s: s = s.replace(old, new, 1)
          elif 'label = { Text("Search courses") }' not in s: raise SystemExit('CPS catalog wrapper marker not found')
          p.write_text(s)

      - name: Add Platforms route
        shell: python
        working-directory: native
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt')
          s = p.read_text()
          marker = '        composable("home") { V2Home(nav, viewModel, state) }\n'
          if 'composable("platforms")' not in s:
              if marker not in s: raise SystemExit('Home route marker not found')
              s = s.replace(marker, marker + '        composable("platforms") { NativePlatformsScreen(nav, state) }\n', 1)
          if 'this == "platforms"' not in s:
              s = s.replace('this == "cps" ||', 'this == "platforms" || this == "cps" ||', 1)
          p.write_text(s)

      - name: Bump Android version
        shell: python
        working-directory: native
        run: |
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 2104000', 'versionCode = 2104100', 1)
          s = s.replace('versionName = "2.10.40"', 'versionName = "2.10.41"', 1)
          if 'versionCode = 2104100' not in s or 'versionName = "2.10.41"' not in s:
              raise SystemExit('Version bump failed')
          p.write_text(s)

      - name: Verify requested Android behavior
        shell: bash
        working-directory: native
        run: |
          grep -q 'nav.navigate("platforms")' app/src/main/java/com/easyeducation/app/NativeLearningHub.kt
          grep -q 'fun NativePlatformsScreen' app/src/main/java/com/easyeducation/app/NativeLearningHub.kt
          grep -q 'composable("platforms")' app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          grep -q 'Search courses' app/src/main/java/com/easyeducation/app/NativeLearningHub.kt
          grep -q 'Search courses' app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt
          grep -q 'Search courses' app/src/main/java/com/easyeducation/app/NativeExternalCoursesScreens.kt
          grep -q 'Search courses' app/src/main/java/com/easyeducation/app/NativeCpsHub.kt
          grep -q 'getIdToken(forceRefresh)' app/src/main/java/com/easyeducation/app/NativeUdvashRepository.kt
          grep -q 'getIdToken(forceRefresh)' app/src/main/java/com/easyeducation/app/NativeCpsRepository.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Kotlin
        working-directory: native
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Commit Android fixes
        working-directory: native
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/easyeducation/app/NativeLearningHub.kt app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt app/src/main/java/com/easyeducation/app/NativeUdvashRepository.kt app/src/main/java/com/easyeducation/app/NativeCpsRepository.kt app/src/main/java/com/easyeducation/app/NativeCpsCatalogUi.kt app/src/main/java/com/easyeducation/app/NativeExternalCoursesRepository.kt app/src/main/java/com/easyeducation/app/NativeEdgeCourseRepository.kt app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt app/src/main/java/com/easyeducation/app/NativeExternalCoursesScreens.kt app/src/main/java/com/easyeducation/app/NativeCpsHub.kt
          if ! git diff --cached --quiet; then
            git commit -m "Release Android 2.10.41 live auth and platform fixes"
            git push origin HEAD:android
          fi

      - name: Restore signing keystore
        working-directory: native
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: native
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        working-directory: native
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        working-directory: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-$VERSION"
          ASSET="Easy-Education-$VERSION.apk"
          APK="$RUNNER_TEMP/$ASSET"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target android --title "Easy Education $VERSION" --notes "Fixes Udvash/CPS live running and upcoming discovery, refreshes expired Easy Education sessions once automatically, makes Platforms a single home card opening a dedicated platform screen, and adds course search to each platform catalog."
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Checkout main for updater
        uses: actions/checkout@v4
        with:
          ref: main
          path: web
          fetch-depth: 0

      - name: Publish updater metadata
        working-directory: web
        run: |
          cat > public/app-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/easyeducation556644-ux/easy-education/releases/download/android-$VERSION/Easy-Education-$VERSION.apk",
            "sha256": "$APK_SHA256",
            "force": false,
            "notes": "Live class counts, automatic session refresh, dedicated Platforms screen and per-platform search."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git commit -m "Publish Android $VERSION live auth fixes metadata"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.41-release-apk
          path: native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
