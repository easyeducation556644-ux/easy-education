name: Android 2.10.41 Live auth platform search fixes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-2.10.41-live-auth-platform-search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VERSION: "2.10.41"
      VERSION_CODE: "2104100"
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix CPS future live classes
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/cps-readonly-v2.js')
          s = p.read_text()
          old = '''function isTodayOrRunning(live, now = new Date()) {
            const status = firstText(live?.status).toLowerCase()
            if (["live", "running", "ongoing", "started", "live now"].includes(status)) return true
            const start = firstText(live?.startTime, live?.startAt, live?.scheduledAt, live?.dateTime, live?.date)
            return Boolean(start) && dhakaDateKey(start) === dhakaDateKey(now)
          }'''
          new = '''function liveStatus(live) {
            return firstText(live?.status, live?.liveStatus).toLowerCase()
          }

          function isRunningLive(live) {
            return ["live", "running", "ongoing", "started", "live now"].includes(liveStatus(live))
          }

          function liveStartMs(live) {
            const value = firstText(live?.startTime, live?.startAt, live?.scheduledAt, live?.dateTime, live?.date)
            const parsed = Date.parse(value)
            return Number.isFinite(parsed) ? parsed : 0
          }

          function isUpcomingLive(live, nowMs = Date.now()) {
            if (isRunningLive(live)) return false
            const status = liveStatus(live)
            if (["ended", "finished", "completed", "cancelled", "canceled", "archive", "archived", "recorded"].includes(status)) return false
            const startMs = liveStartMs(live)
            if (startMs) return startMs >= nowMs - 5 * 60_000
            return ["upcoming", "scheduled", "pending", "waiting"].includes(status)
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'function isUpcomingLive(' not in s:
              raise SystemExit('CPS live helper marker not found')

          old = '''  const liveHighlights = allLive
            .filter((live) => {
              const rawCourseId = liveCourseId(live)
              return rawCourseId && sourceById.has(rawCourseId) && Boolean(accessFor(rawCourseId)) && isTodayOrRunning(live)
            })
            .sort((a, b) => {
              const aRunning = isTodayOrRunning({ ...a, startTime: "" }) ? 0 : 1
              const bRunning = isTodayOrRunning({ ...b, startTime: "" }) ? 0 : 1
              if (aRunning !== bRunning) return aRunning - bRunning
              return (Date.parse(firstText(a.startTime, a.startAt, a.scheduledAt, a.dateTime, a.date)) || Number.MAX_SAFE_INTEGER) - (Date.parse(firstText(b.startTime, b.startAt, b.scheduledAt, b.dateTime, b.date)) || Number.MAX_SAFE_INTEGER)
            })
            .slice(0, 12)
            .map((live) => {
              const rawCourseId = liveCourseId(live)
              const course = sourceById.get(rawCourseId)
              return mapLive(live, { access: accessFor(rawCourseId), courseTitle: firstText(course?.title, course?.name) })
            })

          res.status(200).json({ courses, liveHighlights, serverTimeMs: Date.now(), sourceMode: "firestore-runQuery" })'''
          new = '''  const eligibleLive = allLive
            .filter((live) => {
              const rawCourseId = liveCourseId(live)
              return rawCourseId && sourceById.has(rawCourseId) && Boolean(accessFor(rawCourseId)) && (isRunningLive(live) || isUpcomingLive(live))
            })
            .sort((a, b) => {
              const aRunning = isRunningLive(a) ? 0 : 1
              const bRunning = isRunningLive(b) ? 0 : 1
              if (aRunning !== bRunning) return aRunning - bRunning
              return (liveStartMs(a) || Number.MAX_SAFE_INTEGER) - (liveStartMs(b) || Number.MAX_SAFE_INTEGER)
            })

          const liveHighlights = eligibleLive.slice(0, 100).map((live) => {
            const rawCourseId = liveCourseId(live)
            const course = sourceById.get(rawCourseId)
            return mapLive(live, { access: accessFor(rawCourseId), courseTitle: firstText(course?.title, course?.name) })
          })
          const liveCounts = {
            running: eligibleLive.filter(isRunningLive).length,
            upcoming: eligibleLive.filter(isUpcomingLive).length,
          }

          res.status(200).json({ courses, liveHighlights, liveCounts, serverTimeMs: Date.now(), sourceMode: "firestore-runQuery" })'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const liveCounts = {' not in s:
              raise SystemExit('CPS browse live block not found')
          p.write_text(s)

      - name: Harden Udvash live source discovery
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('server/api-resources/udvash.js')
          s = p.read_text()
          pattern = re.compile(r'async function eligibleLiveSources\(authenticated\) \{.*?\n\}\n\nfunction normalizeLiveRoutine', re.S)
          match = pattern.search(s)
          if not match:
              raise SystemExit('Udvash eligibleLiveSources block not found')
          replacement = '''async function eligibleLiveSources(authenticated) {
            const accountSnapshot = await authenticated.db.collection(ACCOUNTS).get()
            const allAccounts = accountSnapshot.docs
              .map((doc) => ({ id: doc.id, ...(doc.data() || {}) }))
              .filter((account) => text(account.status).toLowerCase() !== "inactive")
              .sort((a, b) => Number(b.lastCheckedAtMs || 0) - Number(a.lastCheckedAtMs || 0))
            if (isFullAdminProfile(authenticated.userProfile)) return allAccounts

            const entitlementSnapshot = await authenticated.db.collection(ENTITLEMENTS)
              .where("userId", "==", authenticated.decodedToken.uid)
              .get()
            const courseIds = entitlementSnapshot.docs
              .map((doc) => doc.data() || {})
              .filter((data) => entitlementActive(data))
              .map((data) => String(data.masterCourseId || data.courseId || ""))
              .filter(Boolean)
            if (!courseIds.length) return []

            const allowedAccountIds = new Set()
            const courseSnapshots = await authenticated.db.getAll(
              ...courseIds.map((courseId) => authenticated.db.collection(COURSES).doc(courseId)),
            )
            courseSnapshots.forEach((snap) => {
              if (!snap.exists) return
              asArray((snap.data() || {}).sourceAccountIds).forEach((id) => id && allowedAccountIds.add(String(id)))
            })

            // Older syncs can have a valid course structure while the canonical course document
            // has a stale/missing sourceAccountIds list. Recover those account ids from the
            // structure documents instead of returning a false 0/0 live-class result.
            const structures = await authenticated.db.collection(STRUCTURES).get()
            const entitledIds = new Set(courseIds)
            structures.docs.forEach((doc) => {
              const data = doc.data() || {}
              const masterCourseId = String(data.masterCourseId || data.courseId || "")
              const accountId = String(data.accountId || "")
              if (accountId && entitledIds.has(masterCourseId)) allowedAccountIds.add(accountId)
            })
            return allAccounts.filter((account) => allowedAccountIds.has(account.id))
          }

          function normalizeLiveRoutine'''
          s = s[:match.start()] + replacement + s[match.end():]

          old = '''    } catch (error) {
              console.warn("[udvash-live]", account.id, error?.message || error)
              return { joinButtonBeforeMinutes: 10, classes: [] }
            }
          })
          const dedupe = new Map()'''
          new = '''    } catch (error) {
              console.warn("[udvash-live]", account.id, error?.message || error)
              return { joinButtonBeforeMinutes: 10, classes: [], error: error?.message || "Udvash live request failed" }
            }
          })
          const successfulResults = results.filter((result) => !result.error)
          if (!successfulResults.length && results.length) {
            const error = new Error(results[0]?.error || "Udvash live classes are temporarily unavailable")
            error.statusCode = 502
            throw error
          }
          const dedupe = new Map()'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const successfulResults = results.filter' not in s:
              raise SystemExit('Udvash live error handling marker not found')
          p.write_text(s)

      - name: Verify backend fixes
        shell: bash
        run: |
          grep -q 'function isUpcomingLive' server/cps-readonly-v2.js
          grep -q 'liveCounts' server/cps-readonly-v2.js
          grep -q 'collection(STRUCTURES).get()' server/api-resources/udvash.js
          grep -q 'successfulResults' server/api-resources/udvash.js
          node --check server/cps-readonly-v2.js
          node --check server/api-resources/udvash.js

      - name: Commit backend fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cps-readonly-v2.js server/api-resources/udvash.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix CPS and Udvash live class discovery"
            git push origin HEAD:main
          fi

      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          path: native
          fetch-depth: 0

      - name: Add automatic Firebase session refresh retries
        shell: python
        working-directory: native
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path); s = p.read_text()
              if old in s:
                  s = s.replace(old, new, 1); p.write_text(s); return
              if new.strip() in s:
                  return
              raise SystemExit(f'{label} marker not found')

          # Udvash: provider access token is already re-authenticated server-side from encrypted
          # credentials. This handles expiry of the Easy Education Firebase token in the app too.
          path = 'app/src/main/java/com/easyeducation/app/NativeUdvashRepository.kt'
          p = Path(path); s = p.read_text()
          old = '''    private fun request(url: String): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in to open Udvash")
              val idToken = Tasks.await(user.getIdToken(false)).token ?: error("Could not refresh your login")
              val request = Request.Builder()
                  .url(url)
                  .header("Authorization", "Bearer $idToken")
                  .header("Accept", "application/json")
                  .get()
                  .build()
              http.newCall(request).execute().use { response ->
                  val raw = response.body?.string().orEmpty()
                  val json = runCatching { JSONObject(raw) }.getOrElse { error("Udvash returned an invalid response") }
                  if (!response.isSuccessful) {
                      error(json.optString("error").ifBlank { "Udvash request failed (${response.code})" })
                  }
                  return json
              }
          }'''
          new = '''    private fun request(url: String): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in to open Udvash")
              fun execute(forceRefresh: Boolean): Pair<Int, String> {
                  val idToken = Tasks.await(user.getIdToken(forceRefresh)).token ?: error("Could not refresh your login")
                  val request = Request.Builder().url(url)
                      .header("Authorization", "Bearer $idToken")
                      .header("Accept", "application/json").get().build()
                  return http.newCall(request).execute().use { response -> response.code to response.body?.string().orEmpty() }
              }
              var (code, raw) = execute(false)
              if (code == 401) {
                  val retried = execute(true)
                  code = retried.first
                  raw = retried.second
              }
              val json = runCatching { JSONObject(raw) }.getOrElse { error("Udvash returned an invalid response") }
              if (code !in 200..299) error(json.optString("error").ifBlank { "Udvash request failed ($code)" })
              return json
          }'''
          if old in s: s = s.replace(old, new, 1)
          elif 'fun execute(forceRefresh: Boolean): Pair<Int, String>' not in s: raise SystemExit('Udvash request marker not found')
          p.write_text(s)

          # Generic external providers, including Bondi Pathshala.
          path = 'app/src/main/java/com/easyeducation/app/NativeExternalCoursesRepository.kt'
          p = Path(path); s = p.read_text()
          old = '''    private fun request(url: String): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in")
              val token = Tasks.await(user.getIdToken(false)).token ?: error("Could not refresh your login")
              val request = Request.Builder()
                  .url(url)
                  .header("Authorization", "Bearer $token")
                  .header("Accept", "application/json")
                  .get()
                  .build()
              http.newCall(request).execute().use { response ->
                  val raw = response.body?.string().orEmpty()
                  val json = runCatching { JSONObject(raw) }.getOrElse { error("Provider returned an invalid response") }
                  if (!response.isSuccessful) error(json.optString("error").ifBlank { "Provider request failed (${response.code})" })
                  return json
              }
          }'''
          new = '''    private fun request(url: String): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in")
              fun execute(forceRefresh: Boolean): Pair<Int, String> {
                  val token = Tasks.await(user.getIdToken(forceRefresh)).token ?: error("Could not refresh your login")
                  val request = Request.Builder().url(url)
                      .header("Authorization", "Bearer $token")
                      .header("Accept", "application/json").get().build()
                  return http.newCall(request).execute().use { response -> response.code to response.body?.string().orEmpty() }
              }
              var (code, raw) = execute(false)
              if (code == 401) {
                  val retried = execute(true)
                  code = retried.first
                  raw = retried.second
              }
              val json = runCatching { JSONObject(raw) }.getOrElse { error("Provider returned an invalid response") }
              if (code !in 200..299) error(json.optString("error").ifBlank { "Provider request failed ($code)" })
              return json
          }'''
          if old in s: s = s.replace(old, new, 1)
          elif 'fun execute(forceRefresh: Boolean): Pair<Int, String>' not in s: raise SystemExit('External request marker not found')
          p.write_text(s)

          # EdgeCourse has both GET and POST requests, so rebuild the request on retry.
          path = 'app/src/main/java/com/easyeducation/app/NativeEdgeCourseRepository.kt'
          p = Path(path); s = p.read_text()
          old = '''    private fun request(url: String, body: JSONObject? = null): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in to open EdgeCourse")
              val idToken = Tasks.await(user.getIdToken(false)).token ?: error("Could not refresh your login")
              val builder = Request.Builder()
                  .url(url)
                  .header("Authorization", "Bearer $idToken")
                  .header("Accept", "application/json")
              if (body == null) builder.get()
              else builder.post(body.toString().toRequestBody("application/json; charset=utf-8".toMediaType()))
              val request = builder.build()
              http.newCall(request).execute().use { response ->
                  val body = response.body?.string().orEmpty()
                  val json = runCatching { JSONObject(body) }.getOrElse {
                      error("EdgeCourse returned an invalid response")
                  }
                  if (!response.isSuccessful) {
                      error(json.optString("error").ifBlank { "EdgeCourse request failed (${response.code})" })
                  }
                  return json
              }
          }'''
          new = '''    private fun request(url: String, body: JSONObject? = null): JSONObject {
              val user = FirebaseAuth.getInstance().currentUser ?: error("Please sign in to open EdgeCourse")
              fun execute(forceRefresh: Boolean): Pair<Int, String> {
                  val idToken = Tasks.await(user.getIdToken(forceRefresh)).token ?: error("Could not refresh your login")
                  val builder = Request.Builder().url(url)
                      .header("Authorization", "Bearer $idToken")
                      .header("Accept", "application/json")
                  if (body == null) builder.get()
                  else builder.post(body.toString().toRequestBody("application/json; charset=utf-8".toMediaType()))
                  return http.newCall(builder.build()).execute().use { response -> response.code to response.body?.string().orEmpty() }
              }
              var (code, raw) = execute(false)
              if (code == 401) {
                  val retried = execute(true)
                  code = retried.first
                  raw = retried.second
              }
              val json = runCatching { JSONObject(raw) }.getOrElse { error("EdgeCourse returned an invalid response") }
              if (code !in 200..299) error(json.optString("error").ifBlank { "EdgeCourse request failed ($code)" })
              return json
          }'''
          if old in s: s = s.replace(old, new, 1)
          elif 'fun execute(forceRefresh: Boolean): Pair<Int, String>' not in s: raise SystemExit('Edge request marker not found')
          p.write_text(s)

      - name: Make CPS session expiry self healing
        shell: python
        working-directory: native
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/easyeducation/app/NativeCpsRepository.kt')
          s = p.read_text()
          pattern = re.compile(r'    private suspend fun get\(action: String, params: Map<String, String> = emptyMap\(\)\): JSONObject \{.*?\n    \}\n\n    private fun rawCourseId', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('CPS get() block not found')
          block = '''    private suspend fun get(action: String, params: Map<String, String> = emptyMap()): JSONObject {
              val user = auth.currentUser ?: error("Sign in to open CPS courses")
              val query = buildList {
                  add("action=${encode(action)}")
                  params.forEach { (key, value) -> add("${encode(key)}=${encode(value)}") }
              }.joinToString("&")

              suspend fun execute(forceRefresh: Boolean): Pair<Int, String> {
                  val easyEducationToken = user.getIdToken(forceRefresh).await().token?.takeIf { it.isNotBlank() }
                      ?: error("Could not verify your Easy Education session")
                  val cpsToken = runCatching {
                      CpsFirebaseSession.sourceIdToken(appContext, forceRefresh = forceRefresh || action == "exam")
                  }.getOrNull()
                  val request = Request.Builder().url("$CPS_API_ORIGIN/api/cps?$query")
                      .header("Authorization", "Bearer $easyEducationToken")
                      .header("Accept", "application/json")
                      .header("User-Agent", "EasyEducationAndroid/${BuildConfig.VERSION_NAME}")
                      .apply { if (!cpsToken.isNullOrBlank()) header("X-CPS-Firebase-Token", cpsToken) }
                      .get().build()
                  return withContext(Dispatchers.IO) {
                      http.newCall(request).execute().use { response -> response.code to response.body?.string().orEmpty() }
                  }
              }

              var (code, body) = execute(false)
              if (code == 401) {
                  val retried = execute(true)
                  code = retried.first
                  body = retried.second
              }
              if (code !in 200..299) {
                  val message = runCatching { JSONObject(body).optString("error") }.getOrNull()?.takeIf { it.isNotBlank() }
                      ?: when (code) {
                          401 -> "Your session could not be refreshed. Please sign in again."
                          403 -> "This CPS item is locked or needs CPS verification."
                          else -> "CPS is temporarily unavailable. Please retry."
                      }
                  error(message)
              }
              return JSONObject(body)
          }

          private fun rawCourseId'''
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)

          # The alternate CPS catalog client also retries a stale Easy Education token once.
          p = Path('app/src/main/java/com/easyeducation/app/NativeCpsCatalogUi.kt')
          s = p.read_text()
          pattern = re.compile(r'    private suspend fun request\(action: String, params: Map<String, String> = emptyMap\(\)\): JSONObject \{.*?\n    \}\n\n    private fun parseCatalog', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('CPS catalog request block not found')
          block = '''    private suspend fun request(action: String, params: Map<String, String> = emptyMap()): JSONObject {
              val user = auth.currentUser ?: error("Sign in to browse CPS")
              val query = buildList {
                  add("action=${encode(action)}")
                  params.forEach { (key, value) -> add("${encode(key)}=${encode(value)}") }
              }.joinToString("&")
              suspend fun execute(forceRefresh: Boolean): Pair<Int, String> {
                  val token = user.getIdToken(forceRefresh).await().token?.takeIf { it.isNotBlank() }
                      ?: error("Could not verify your account")
                  val request = Request.Builder().url("$CPS_CATALOG_ORIGIN/api/cps?$query")
                      .header("Authorization", "Bearer $token")
                      .header("Accept", "application/json")
                      .header("User-Agent", "EasyEducationAndroid/${BuildConfig.VERSION_NAME}")
                      .get().build()
                  return withContext(Dispatchers.IO) {
                      http.newCall(request).execute().use { response -> response.code to response.body?.string().orEmpty() }
                  }
              }
              var (code, body) = execute(false)
              if (code == 401) {
                  val retried = execute(true)
                  code = retried.first
                  body = retried.second
              }
              if (code !in 200..299) {
                  val message = runCatching { JSONObject(body).optString("error") }.getOrNull()?.takeIf { it.isNotBlank() }
                      ?: "CPS request failed ($code)"
                  error(message)
              }
              return JSONObject(body)
          }

          private fun parseCatalog'''
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)

      - name: Make Platforms a single home destination and refresh live data
        shell: python
        working-directory: native
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/easyeducation/app/NativeLearningHub.kt')
          s = p.read_text()
          if 'import androidx.compose.material3.OutlinedTextField' not in s:
              s = s.replace('import androidx.compose.material3.MaterialTheme\n', 'import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedTextField\n', 1)
          if 'import androidx.compose.runtime.saveable.rememberSaveable' not in s:
              s = s.replace('import androidx.compose.runtime.rememberCoroutineScope\n', 'import androidx.compose.runtime.rememberCoroutineScope\nimport androidx.compose.runtime.saveable.rememberSaveable\n', 1)

          pattern = re.compile(r'@Composable\nfun NativePlatformsHomeCard\(nav: NavHostController, state: NativeUiState\) \{.*?\n\}\n\n@Composable\nfun NativeManualCoursesScreen', re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('Platforms home block not found')
          replacement = '''@Composable
          fun NativePlatformsHomeCard(nav: NavHostController, state: NativeUiState) {
              val manualCount = manualEasyEducationCourses(state).size
              Card(
                  modifier = Modifier.fillMaxWidth().clickable { nav.navigate("platforms") },
                  shape = HubCardShape,
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
              ) {
                  Row(Modifier.fillMaxWidth().padding(17.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(shape = RoundedCornerShape(15.dp), color = MaterialTheme.colorScheme.primaryContainer) {
                          Icon(Icons.Default.School, null, Modifier.padding(11.dp).size(25.dp), tint = MaterialTheme.colorScheme.onPrimaryContainer)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                          Text("Platforms", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.ExtraBold)
                          Text("7 learning platforms • $manualCount Easy Education courses", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Text("Tap to choose a platform", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary)
                      }
                      Icon(Icons.Default.ArrowForward, "Open platforms")
                  }
              }
          }

          @Composable
          fun NativePlatformsScreen(nav: NavHostController, state: NativeUiState) {
              val manualCount = manualEasyEducationCourses(state).size
              val platforms = listOf(
                  HubPlatform("Easy Education manual uploaded courses", "$manualCount available in My Courses", "manual-courses"),
                  HubPlatform("CPS", "Courses, live classes, exams and resources", "cps"),
                  HubPlatform("EdgeCourse", "Course catalog and class resources", "edgecourse"),
                  HubPlatform("Udvash", "Structured courses from your Udvash access", "udvash"),
                  HubPlatform("iEducation", "Live course catalog", "provider/ieducation"),
                  HubPlatform("Medilogy", "Live course catalog", "provider/medilogy"),
                  HubPlatform("Bondi Pathshala", "Subjects, chapters and classes", "provider/bondipathshala"),
              )
              LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  item { HubHeader(nav, "Platforms", "Choose where you want to learn") }
                  items(platforms, key = { it.route }) { platform ->
                      Card(
                          modifier = Modifier.fillMaxWidth().clickable { nav.navigate(platform.route) },
                          shape = HubRowShape,
                          border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      ) {
                          Row(Modifier.fillMaxWidth().padding(15.dp), verticalAlignment = Alignment.CenterVertically) {
                              Surface(shape = RoundedCornerShape(13.dp), color = MaterialTheme.colorScheme.primaryContainer) {
                                  Icon(Icons.Default.School, null, Modifier.padding(9.dp).size(22.dp), tint = MaterialTheme.colorScheme.onPrimaryContainer)
                              }
                              Spacer(Modifier.width(12.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(platform.title, fontWeight = FontWeight.ExtraBold, maxLines = 2, overflow = TextOverflow.Ellipsis)
