name: Android 2.10.33 EdgeCourse CPS-style UI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-2.10.33-edgecourse-cps-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: "2.10.33"
      VERSION_CODE: "2103300"
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}

    steps:
      - name: Checkout web main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          path: native

      - name: Verify EdgeCourse CPS-style refactor
        shell: bash
        run: |
          grep -q 'versionCode = 2103300' native/app/build.gradle.kts
          grep -q 'versionName = "2.10.33"' native/app/build.gradle.kts
          grep -q 'EdgePage.HEADER' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt
          grep -q 'EdgePage.SECTION' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt
          grep -q 'EdgePage.MODULE' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt
          grep -q 'EdgeWatchHost' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt
          grep -q 'YoutubeClassWatchPage(watchNav, viewModel, state, cid, classId)' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt
          grep -q 'NativeEdgeCourseDetailScreen(nav, viewModel, state' native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          grep -q 'NativeEdgeCourseWebSupport.requiresWebView(classItem.sourceUrl)' native/app/src/main/java/com/easyeducation/app/YoutubeClassWatchPage.kt
          test -f native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseInlinePlayer.kt
          if grep -q 'AnimatedVisibility' native/app/src/main/java/com/easyeducation/app/NativeEdgeCourseScreens.kt; then
            echo 'EdgeCourse dropdown/accordion UI is still present'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        shell: bash
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: native

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs native/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-$VERSION"
          ASSET="Easy-Education-$VERSION.apk"
          APK="$RUNNER_TEMP/$ASSET"
          cp native/app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="EdgeCourse UI correction: cards now follow the CPS design, course content uses screen-by-screen navigation instead of dropdowns, and EdgeCourse classes open in the normal Easy Education class page with inline embed fallback for web-only video providers."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Easy Education $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target android --title "Easy Education $VERSION" --notes "$NOTES"
          fi
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish in-app update metadata
        shell: bash
        run: |
          cat > public/app-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/easyeducation556644-ux/easy-education/releases/download/android-$VERSION/Easy-Education-$VERSION.apk",
            "sha256": "$APK_SHA256",
            "force": false,
            "notes": "EdgeCourse now matches CPS card/navigation style and classes open in the normal Easy Education class page."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git commit -m "Publish Android $VERSION EdgeCourse UI update metadata"
          git push origin HEAD:main

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.33-release-apk
          path: native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
