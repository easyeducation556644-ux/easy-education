name: Prepare 2.10.41 Udvash live fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/prepare-2.10.41-udvash-live-fix.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Udvash live source discovery
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('server/api-resources/udvash.js')
          s = p.read_text()

          eligible = re.compile(r'async function eligibleLiveSources\(authenticated\) \{.*?\n\}\n\nfunction normalizeLiveRoutine', re.S)
          replacement = '''async function eligibleLiveSources(authenticated) {
            const accountSnapshot = await authenticated.db.collection(ACCOUNTS).get()
            const allAccounts = accountSnapshot.docs
              .map((doc) => ({ id: doc.id, ...(doc.data() || {}) }))
              .filter((account) => text(account.status).toLowerCase() !== "inactive")
              .sort((a, b) => Number(b.lastCheckedAtMs || 0) - Number(a.lastCheckedAtMs || 0))
            if (isFullAdminProfile(authenticated.userProfile)) return allAccounts

            const entitlementSnapshot = await authenticated.db.collection(ENTITLEMENTS)
              .where("userId", "==", authenticated.decodedToken.uid)
              .get()
            const courseIds = entitlementSnapshot.docs
              .map((doc) => doc.data() || {})
              .filter((data) => entitlementActive(data))
              .map((data) => String(data.masterCourseId || data.courseId || ""))
              .filter(Boolean)
            if (!courseIds.length) return []

            const allowedAccountIds = new Set()
            const courseSnapshots = await authenticated.db.getAll(
              ...courseIds.map((courseId) => authenticated.db.collection(COURSES).doc(courseId)),
            )
            courseSnapshots.forEach((snap) => {
              if (!snap.exists) return
              asArray((snap.data() || {}).sourceAccountIds).forEach((id) => id && allowedAccountIds.add(String(id)))
            })

            const entitledIds = new Set(courseIds)
            const structures = await authenticated.db.collection(STRUCTURES).get()
            structures.docs.forEach((doc) => {
              const data = doc.data() || {}
              const masterCourseId = String(data.masterCourseId || data.courseId || "")
              const accountId = String(data.accountId || "")
              if (accountId && entitledIds.has(masterCourseId)) allowedAccountIds.add(accountId)
            })
            return allAccounts.filter((account) => allowedAccountIds.has(account.id))
          }

          function normalizeLiveRoutine'''
          s, count = eligible.subn(replacement, s, count=1)
          if count != 1: raise SystemExit('Could not patch eligibleLiveSources')

          if 'const successfulResults = results.filter' not in s:
              catch = re.compile(
                  r'(\s*\} catch \(error\) \{\n\s*console\.warn\("\[udvash-live\]", account\.id, error\?\.message \|\| error\)\n)'
                  r'\s*return \{ joinButtonBeforeMinutes: 10, classes: \[\] \}\n'
                  r'(\s*\}\n\s*\}\)\n)\s*const dedupe = new Map\(\)',
                  re.S,
              )
              def repl(m):
                  return (
                      m.group(1)
                      + '      return { joinButtonBeforeMinutes: 10, classes: [], error: error?.message || "Udvash live request failed" }\n'
                      + m.group(2)
                      + '  const successfulResults = results.filter((result) => !result.error)\n'
                      + '  if (!successfulResults.length && results.length) {\n'
                      + '    const error = new Error(results[0]?.error || "Udvash live classes are temporarily unavailable")\n'
                      + '    error.statusCode = 502\n'
                      + '    throw error\n'
                      + '  }\n'
                      + '  const dedupe = new Map()'
                  )
              s, count = catch.subn(repl, s, count=1)
              if count != 1: raise SystemExit('Could not patch Udvash live error handling')

          p.write_text(s)

      - name: Verify and push
        run: |
          node --check server/api-resources/udvash.js
          grep -q 'collection(STRUCTURES).get()' server/api-resources/udvash.js
          grep -q 'const successfulResults = results.filter' server/api-resources/udvash.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api-resources/udvash.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix Udvash live source recovery"
            git push origin HEAD:main
          fi

      - name: Run 2.10.41 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-2.10.41-live-auth-platform-search.yml --ref main
