name: Android 2.10.37 Udvash live route refresh

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-2.10.37-udvash-live-route.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: "2.10.37"
      VERSION_CODE: "2103700"
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}

    steps:
      - name: Checkout web main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Udvash catalog subjects chapters live per route
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/api-resources/udvash.js')
          s = p.read_text()

          old_catalog = '''async function catalog(res, authenticated) {
            const snapshot = await authenticated.db.collection(COURSES).get()
            const now = Date.now()
            let entitlementMap = new Map()
            if (!isFullAdminProfile(authenticated.userProfile)) {
              const entitlements = await authenticated.db.collection(ENTITLEMENTS)
                .where("userId", "==", authenticated.decodedToken.uid)
                .get()
              entitlementMap = new Map(entitlements.docs
                .map((doc) => doc.data() || {})
                .filter((data) => entitlementActive(data, now))
                .map((data) => [String(data.masterCourseId || data.courseId || ""), data]))
            }

            const courses = snapshot.docs
              .map((doc) => ({ id: doc.id, ...(doc.data() || {}) }))
              .filter((course) => isFullAdminProfile(authenticated.userProfile) || entitlementMap.has(String(course.masterCourseId || course.id)))
              .map((course) => {
                const entitlement = entitlementMap.get(String(course.masterCourseId || course.id))
                return {
                  id: String(course.masterCourseId || course.id),
                  masterCourseId: intValue(course.masterCourseId || course.id),
                  title: text(course.name) || "Udvash Course",
                  iconPath: text(course.iconPath),
                  rank: intValue(course.rank),
                  source: "udvash",
                  hasAccess: true,
                  accessType: isFullAdminProfile(authenticated.userProfile) ? "admin" : text(entitlement?.accessType) || "premium",
                  accessExpiresAtMs: Number(entitlement?.expiresAtMs || 0),
                }
              })
              .sort((a, b) => (a.rank - b.rank) || a.title.localeCompare(b.title))
            return res.status(200).json({ accessMode: "premium", courses })
          }
          '''
          new_catalog = '''async function catalog(res, authenticated) {
            // The Android client already paints its route cache first. This request is therefore the
            // live revalidation pass: refresh only the course route, never crawl subjects/chapters.
            const accountSnapshot = await authenticated.db.collection(ACCOUNTS).get()
            const activeAccounts = accountSnapshot.docs
              .map((doc) => ({ id: doc.id, ...(doc.data() || {}) }))
              .filter((account) => text(account.status).toLowerCase() !== "inactive")

            await mapLimit(activeAccounts, 3, async (account) => {
              try {
                const courseTypeId = intValue(account.courseTypeId, DEFAULT_COURSE_TYPE_ID)
                const payload = await accountRequest(account.id, authenticated.db, `/Content/Courses?id=${courseTypeId}`)
                const rows = asArray(payload?.data?.masterCourseList)
                  .map((row) => normalizeCourse(row, account.id, courseTypeId))
                  .filter((row) => row.masterCourseId)
                await mapLimit(rows, 8, async (course) => {
                  await authenticated.db.collection(COURSES).doc(String(course.masterCourseId)).set({
                    ...course,
                    sourceAccountId: FieldValue.delete(),
                    sourceAccountIds: FieldValue.arrayUnion(account.id),
                    updatedAtMs: Date.now(),
                  }, { merge: true })
                })
                await authenticated.db.collection(ACCOUNTS).doc(account.id).set({
                  courseCount: rows.length,
                  lastCheckedAtMs: Date.now(),
                  lastError: "",
                  status: "active",
                  updatedAtMs: Date.now(),
                }, { merge: true })
              } catch (error) {
                await authenticated.db.collection(ACCOUNTS).doc(account.id).set({
                  lastError: text(error?.message).slice(0, 500),
                  updatedAtMs: Date.now(),
                }, { merge: true }).catch(() => {})
              }
            })

            const snapshot = await authenticated.db.collection(COURSES).get()
            const now = Date.now()
            let entitlementMap = new Map()
            if (!isFullAdminProfile(authenticated.userProfile)) {
              const entitlements = await authenticated.db.collection(ENTITLEMENTS)
                .where("userId", "==", authenticated.decodedToken.uid)
                .get()
              entitlementMap = new Map(entitlements.docs
                .map((doc) => doc.data() || {})
                .filter((data) => entitlementActive(data, now))
                .map((data) => [String(data.masterCourseId || data.courseId || ""), data]))
            }

            const courses = snapshot.docs
              .map((doc) => ({ id: doc.id, ...(doc.data() || {}) }))
              .filter((course) => isFullAdminProfile(authenticated.userProfile) || entitlementMap.has(String(course.masterCourseId || course.id)))
              .map((course) => {
                const entitlement = entitlementMap.get(String(course.masterCourseId || course.id))
                return {
                  id: String(course.masterCourseId || course.id),
                  masterCourseId: intValue(course.masterCourseId || course.id),
                  title: text(course.name) || "Udvash Course",
                  iconPath: text(course.iconPath),
                  rank: intValue(course.rank),
                  source: "udvash",
                  hasAccess: true,
                  accessType: isFullAdminProfile(authenticated.userProfile) ? "admin" : text(entitlement?.accessType) || "premium",
                  accessExpiresAtMs: Number(entitlement?.expiresAtMs || 0),
                }
              })
              .sort((a, b) => (a.rank - b.rank) || a.title.localeCompare(b.title))
            return res.status(200).json({ accessMode: "premium", courses, fetchedAtMs: Date.now() })
          }
          '''

          old_subjects = '''async function subjects(req, res, authenticated) {
            const courseId = validId(req.query?.courseId)
            if (!courseId) return res.status(400).json({ error: "courseId is required" })
            const { structure } = await structureForCourse(authenticated, courseId)
            const rows = asArray(structure.subjects).map(({ chapters, ...subject }) => ({
              ...subject,
              chapterCount: asArray(chapters).length,
            }))
            return res.status(200).json({ course: structure.course || {}, subjects: rows, syncedAtMs: Number(structure.syncedAtMs || 0) })
          }
          '''
          new_subjects = '''async function subjects(req, res, authenticated) {
            const courseId = validId(req.query?.courseId)
            if (!courseId) return res.status(400).json({ error: "courseId is required" })
            const { source, structure } = await structureForCourse(authenticated, courseId)
            const courseTypeId = intValue(source.account?.courseTypeId, structure.masterCourseTypeId || DEFAULT_COURSE_TYPE_ID)
            const payload = await accountRequest(
              source.accountId,
              authenticated.db,
              `/Content/Subjects?courseTypeId=${courseTypeId}&masterCourseId=${courseId}`,
            )
            const cachedSubjects = new Map(asArray(structure.subjects).map((subject) => [intValue(subject?.subjectId), subject]))
            const liveSubjects = asArray(payload?.data?.subjectList)
              .map(normalizeSubject)
              .filter((subject) => subject.subjectId)
              .map((subject) => ({ ...subject, chapters: asArray(cachedSubjects.get(subject.subjectId)?.chapters) }))
            const courseContents = asArray(payload?.data?.courseWiseContentViewModelList).map(courseWideContent)
            const fetchedAtMs = Date.now()
            await authenticated.db.collection(STRUCTURES).doc(`${source.accountId}_${courseId}`).set({
              subjects: liveSubjects,
              courseContents,
              syncedAtMs: fetchedAtMs,
            }, { merge: true })
            const rows = liveSubjects.map(({ chapters, ...subject }) => ({
              ...subject,
              chapterCount: asArray(chapters).length,
            }))
            return res.status(200).json({ course: structure.course || {}, subjects: rows, syncedAtMs: fetchedAtMs })
          }
          '''

          old_chapters = '''async function chapters(req, res, authenticated) {
            const courseId = validId(req.query?.courseId)
            const subjectId = intValue(req.query?.subjectId)
            if (!courseId || !subjectId) return res.status(400).json({ error: "courseId and subjectId are required" })
            const { structure } = await structureForCourse(authenticated, courseId)
            const subject = asArray(structure.subjects).find((row) => intValue(row?.subjectId) === subjectId)
            if (!subject) return res.status(404).json({ error: "Subject not found in cached Udvash structure" })
            return res.status(200).json({ subject: { ...subject, chapters: undefined }, chapters: asArray(subject.chapters), syncedAtMs: Number(structure.syncedAtMs || 0) })
          }
          '''
          new_chapters = '''async function chapters(req, res, authenticated) {
            const courseId = validId(req.query?.courseId)
            const subjectId = intValue(req.query?.subjectId)
            if (!courseId || !subjectId) return res.status(400).json({ error: "courseId and subjectId are required" })
            const { source, structure } = await structureForCourse(authenticated, courseId)
            const subjects = asArray(structure.subjects)
            const subject = subjects.find((row) => intValue(row?.subjectId) === subjectId)
            if (!subject) return res.status(404).json({ error: "Subject not found in Udvash structure" })
            const payload = await accountRequest(
              source.accountId,
              authenticated.db,
              `/Content/Chapters?masterCourseId=${courseId}&subjectId=${subjectId}&ln=Bn`,
            )
            const liveChapters = asArray(payload?.data?.masterChapterList)
              .map(normalizeChapter)
              .filter((chapter) => chapter.masterChapterId)
            const fetchedAtMs = Date.now()
            const nextSubjects = subjects.map((row) => intValue(row?.subjectId) === subjectId ? { ...row, chapters: liveChapters } : row)
            await authenticated.db.collection(STRUCTURES).doc(`${source.accountId}_${courseId}`).set({
              subjects: nextSubjects,
              syncedAtMs: fetchedAtMs,
            }, { merge: true })
            return res.status(200).json({
              subject: { ...subject, chapters: undefined },
              chapters: liveChapters,
              syncedAtMs: fetchedAtMs,
            })
          }
          '''

          for old, new, name in [
              (old_catalog, new_catalog, 'catalog'),
              (old_subjects, new_subjects, 'subjects'),
              (old_chapters, new_chapters, 'chapters'),
          ]:
              if old not in s:
                  raise SystemExit(f'{name} block not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Commit live-route backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api-resources/udvash.js
          git commit -m "Refresh Udvash data on every route"
          git push origin HEAD:main

      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          path: native
          fetch-depth: 0

      - name: Bump Android and polish watch-route shell
        shell: python
        run: |
          from pathlib import Path
          p = Path('native/app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 2103600', 'versionCode = 2103700').replace('versionName = "2.10.36"', 'versionName = "2.10.37"')
          p.write_text(s)

          p = Path('native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt')
          s = p.read_text()
          s = s.replace('val isWatchRoute = currentRoute.startsWith("class/")', 'val isWatchRoute = currentRoute.startsWith("class/") || currentRoute.startsWith("udvash-class/") || currentRoute.startsWith("provider-class/")')
          p.write_text(s)

      - name: Verify platform integration
        shell: bash
        run: |
          grep -q 'versionCode = 2103700' native/app/build.gradle.kts
          grep -q 'versionName = "2.10.37"' native/app/build.gradle.kts
          grep -q 'Checking for updates' native/app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt
          grep -q 'YoutubeClassWatchPage' native/app/src/main/java/com/easyeducation/app/NativeUdvashScreens.kt
          grep -q 'resolveUdvash' native/app/src/main/java/com/easyeducation/app/NativePlaybackSourceResolver.kt
          grep -q 'youtubeUrl.isNotBlank' native/app/src/main/java/com/easyeducation/app/NativePlaybackSourceResolver.kt
          grep -q 'needsFreshSignedSource' native/app/src/main/java/com/easyeducation/app/NativeInlinePlayer.kt
          test -f native/app/src/main/java/com/easyeducation/app/NativeExternalCoursesRepository.kt
          test -f native/app/src/main/java/com/easyeducation/app/NativeExternalCoursesScreens.kt
          grep -q 'NativeExternalPlatformsHomeBlock' native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          grep -q 'provider-class/' native/app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          grep -q 'bondipathshalaschool.com.bd/api/courses' server/api-resources/external-courses.js
          grep -q 'ieducationbd.com/api/course/admin/course/all-course' server/api-resources/external-courses.js
          grep -q 'medilogy.com.bd/api/course/admin/course/all-course' server/api-resources/external-courses.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin
        working-directory: native

      - name: Commit Android 2.10.37
        shell: bash
        working-directory: native
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/easyeducation/app/NativeAppUiV2.kt
          git commit -m "Release Android 2.10.37 route refresh"
          git push origin HEAD:android

      - name: Restore signing keystore
        shell: bash
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: native

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs native/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-$VERSION"
          ASSET="Easy-Education-$VERSION.apk"
          APK="$RUNNER_TEMP/$ASSET"
          cp native/app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Udvash is now true cache-first + live-per-route: every screen paints cached data immediately, then refreshes that exact Udvash route while the bottom loader is visible. Subjects and chapters no longer depend only on the admin scan. Default Easy Education class page, Resources notes, YouTube-first playback and automatic signed-source re-resolution remain enabled. Includes iEducation, Medilogy and BP School native provider flows."
          gh release create "$TAG" "$APK" --target android --title "Easy Education $VERSION" --notes "$NOTES"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish in-app update metadata
        shell: bash
        run: |
          cat > public/app-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://github.com/easyeducation556644-ux/easy-education/releases/download/android-$VERSION/Easy-Education-$VERSION.apk",
            "sha256": "$APK_SHA256",
            "force": false,
            "notes": "True cache-first/live-per-route Udvash refresh plus iEducation, Medilogy and BP School."
          }
          EOF
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git commit -m "Publish Android $VERSION route refresh metadata"
          git push origin HEAD:main

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.37-release-apk
          path: native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
