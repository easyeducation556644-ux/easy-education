name: Android production APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/android-release-trigger"

permissions:
  contents: read
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-education-release.jks"
          chmod 600 "$RUNNER_TEMP/easy-education-release.jks"
      - name: Build signed production APK
        working-directory: android-app
        env:
          EE_KEYSTORE_PATH: ${{ runner.temp }}/easy-education-release.jks
          EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
          EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
          EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify production signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: easy-education-production-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish Android verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": "Signed native Android APK build and signature verification",
              "context": "Android native APK",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
