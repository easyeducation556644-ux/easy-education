name: Final web + Android release verification

on:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - "api/**"
      - "server/**"
      - "src/**"
      - "vercel.json"
      - ".github/workflows/android-debug-apk.yml"
      - "tools/apply_cps_home_release_patch.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}
    steps:
      - name: Publish release verification pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "Web + CPS + signed Android 2.10.10 verification is running",
              "context": "Easy Education final release 2.10.10",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"

      - uses: actions/checkout@v4

      - name: Verify committed CPS Home wiring
        run: python tools/apply_cps_home_release_patch.py

      - name: Verify CPS source is read-only
        shell: bash
        run: |
          node --check server/cps-readonly-v2.js
          python - <<'PY'
          from pathlib import Path
          source = Path('server/cps-readonly-v2.js').read_text()
          # Guard executable source, not words that merely appear inside // documentation comments.
          executable = '\n'.join(line.split('//', 1)[0] for line in source.splitlines())
          forbidden = [
              'documents:commit', 'batchWrite', 'createDocument',
              'method: "PATCH"', 'method: "PUT"', 'method: "DELETE"',
              "method: 'PATCH'", "method: 'PUT'", "method: 'DELETE'",
          ]
          hits = [needle for needle in forbidden if needle in executable]
          if hits:
              raise SystemExit('Forbidden CPS upstream mutation capability found: ' + ', '.join(hits))
          if ':runQuery' not in executable or 'method: "POST"' not in executable:
              raise SystemExit('CPS Firestore runQuery read transport is missing')
          if 'authenticated.db.collection(ENTITLEMENTS)' not in executable:
              raise SystemExit('Easy Education entitlement storage is missing')
          print('PASS: CPS upstream uses Firestore runQuery reads only; access writes stay in Easy Education Firestore')
          PY

      - name: Verify Vercel Hobby function budget
        shell: bash
        run: |
          count=$(find api -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | wc -l | tr -d ' ')
          echo "Deployable Vercel function files: $count / 12"
          test "$count" -le 12
          test ! -f api/cps.js
          test ! -f api/create-payment.js
          test ! -f api/verify-payment.js
          test ! -f api/upload-image.js

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify production web build
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore release keystore
        shell: bash
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Verify signing certificate
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$EE_KEYSTORE_PATH" \
            -alias "$EE_KEY_ALIAS" \
            -storepass "$EE_KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: android-app

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.10-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Publish release verification final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": "Web, CPS read-only bridge, Vercel budget and signed Android 2.10.10 verified",
              "context": "Easy Education final release 2.10.10",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
