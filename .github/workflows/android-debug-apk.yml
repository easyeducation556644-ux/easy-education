name: Final web + Android release verification

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "server/**"
      - "src/**"
      - "vercel.json"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      EE_KEYSTORE_PATH: /tmp/easy-education-release.jks
      EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
      EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
      EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}
    steps:
      - name: Publish release verification pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["RUN_URL"],
              "description": "Web + CPS + signed Android 2.10.17 verification is running",
              "context": "Easy Education final release 2.10.17",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"

      - name: Checkout web
        uses: actions/checkout@v4

      - name: Verify CPS source stays read-only
        shell: bash
        run: |
          node --check server/cps-readonly-v2.js
          node --check server/api-resources/cps-academic-v3.js
          node --check server/api-resources/cps-routine.js
          python - <<'PY'
          from pathlib import Path
          for path in ['server/cps-readonly-v2.js', 'server/api-resources/cps-academic-v3.js', 'server/api-resources/cps-routine.js']:
              source = Path(path).read_text()
              executable = '\n'.join(line.split('//', 1)[0] for line in source.splitlines())
              forbidden = ['documents:commit', 'batchWrite', 'createDocument', 'method: "PATCH"', 'method: "PUT"', 'method: "DELETE"']
              hits = [needle for needle in forbidden if needle in executable]
              if hits:
                  raise SystemExit(f'Forbidden CPS upstream mutation capability in {path}: ' + ', '.join(hits))
              if ':runQuery' not in executable or 'method: "POST"' not in executable:
                  raise SystemExit(f'CPS read transport missing in {path}')
          print('PASS: CPS upstream handlers are read-only')
          PY

      - name: Verify Vercel Hobby function budget
        shell: bash
        run: |
          count=$(find api -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | wc -l | tr -d ' ')
          echo "Deployable Vercel function files: $count / 12"
          test "$count" -le 12
          test ! -f api/trials.js
          test ! -f api/exam-results.js
          test ! -f api/cps.js

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify production web build
        run: |
          npm ci
          npm run build

      - name: Checkout native-only Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          path: native

      - name: Verify final native source
        shell: bash
        run: |
          grep -q 'versionName = "2.10.17"' native/app/build.gradle.kts
          grep -q 'NativeCpsCourseExperienceV4' native/app/src/main/java/com/easyeducation/app/NativeCpsHub.kt
          grep -q 'NativeCpsExamSafeActivity.open' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          ! grep -q 'NativeCpsExamV2Activity.open' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          grep -q 'LaunchedEffect(initialClassId)' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          ! grep -q 'LaunchedEffect(initialClassId, launched)' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          grep -q 'YoutubeClassWatchPage' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          grep -q 'sortedBy { it.order }' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          grep -q 'formatCpsMath' native/app/src/main/java/com/easyeducation/app/NativeCpsExamSafeActivity.kt
          grep -q 'NativeClassTopicsAction' native/app/src/main/java/com/easyeducation/app/YoutubeClassWatchPage.kt
          grep -q 'NativeClassTopicsDescription' native/app/src/main/java/com/easyeducation/app/YoutubeClassWatchPage.kt
          grep -q 'NativePlayerTopics.attachToSurface' native/app/src/main/java/com/easyeducation/app/NativeInlinePlayer.kt
          grep -q 'FrameLayout.LayoutParams' native/app/src/main/java/com/easyeducation/app/NativeClassTopics.kt
          grep -q 'applySavedPosition' native/app/src/main/java/com/easyeducation/app/PersistentNativePlayer.kt
          grep -q 'bunny-hls' native/app/src/main/java/com/easyeducation/app/DownloadQualityResolver.kt
          grep -q 'resolvedUrl' native/app/src/main/java/com/easyeducation/app/NativeAppViewModel.kt
          grep -q 'NativeCpsRoutineRepository' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          grep -q 'player.mediadelivery.net' native/app/src/main/java/com/easyeducation/app/NativePlaybackSourceResolver.kt
          ! grep -q 'expandedChapter' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt
          ! grep -q 'expandedClass' native/app/src/main/java/com/easyeducation/app/NativeCpsCourseExperienceV4.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore release keystore
        shell: bash
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EE_KEYSTORE_BASE64"
          printf '%s' "$EE_KEYSTORE_BASE64" | base64 --decode > "$EE_KEYSTORE_PATH"
          test -s "$EE_KEYSTORE_PATH"

      - name: Verify signing certificate
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$EE_KEYSTORE_PATH" \
            -alias "$EE_KEY_ALIAS" \
            -storepass "$EE_KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        run: gradle :app:assembleRelease
        working-directory: native

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs native/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: easy-education-2.10.17-release-apk
          path: native/app/build/outputs/apk/release/app-release.apk

      - name: Publish release verification final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": "Web, Vercel budget and signed Android 2.10.17 verified",
              "context": "Easy Education final release 2.10.17",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
