name: Recover CPS API

on:
  push:
    branches: ["agent/cps-integration-verification-staging"]

permissions:
  contents: write

jobs:
  recover:
    if: startsWith(github.event.head_commit.message, '[cps-stage7]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover intact CPS API entry
        shell: bash
        run: |
          cat .github/cps-apply-once/payload.*.b64 | base64 --decode > "$RUNNER_TEMP/cps_payload.tar.gz"
          set +e
          gzip -dc "$RUNNER_TEMP/cps_payload.tar.gz" > "$RUNNER_TEMP/cps_payload.tar"
          tar -xf "$RUNNER_TEMP/cps_payload.tar" -C . --ignore-zeros
          set -e
          test -s api/cps.js
          node --check api/cps.js
      - name: Commit recovered API
        shell: bash
        run: |
          git config user.name "easy-education-cps-bot"
          git config user.email "easyeducation556644@gmail.com"
          git add api/cps.js
          git commit -m "[cps-recovered-api] Restore CPS read-only backend bridge"
          git push origin HEAD:${GITHUB_REF_NAME}
